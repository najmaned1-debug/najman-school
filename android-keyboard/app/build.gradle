plugins {
    id 'com.android.application'
}

android {
    namespace 'com.najman.najmaboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.najman.najmaboard'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        najman {
            storeFile file('../najmanschool.jks')
            storePassword 'najman2026'
            keyAlias 'najman'
            keyPassword 'najman2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.najman
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.najman
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
